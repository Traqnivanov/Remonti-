name: One-time Hero and bot cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hero-bot-cleanup-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          def sub(pattern, repl, expected=None, flags=0, label='replacement'):
              global s
              s2, n = re.subn(pattern, repl, s, flags=flags)
              if expected is not None and n != expected:
                  raise SystemExit(f'{label}: expected {expected}, got {n}')
              s = s2
              print(f'{label}: {n}')

          # 1) Remove Hero calculator badge + typewriter block.
          sub(
              r'\n<div id="hero-calc-badge".*?</div>\n<div style="margin-top:\.7rem;min-height:24px;">.*?</div>\n(?=<div class="hero-stats">)',
              '\n', expected=1, flags=re.S, label='hero calculator/typewriter block'
          )

          # 2) Hero stats start with final values. Desktop animation resets them; mobile stays static.
          if '<span class="hstat-num" data-target="250">0</span>' not in s or '<span class="hstat-num" data-target="23">0</span>' not in s:
              raise SystemExit('hero counter source values not found')
          s = s.replace('<span class="hstat-num" data-target="250">0</span>', '<span class="hstat-num" data-target="250">250+</span>', 1)
          s = s.replace('<span class="hstat-num" data-target="23">0</span>', '<span class="hstat-num" data-target="23">23г.</span>', 1)

          # 3) Remove calculator buttons from service cards.
          sub(r'\n<button class="card-calc-btn".*?</button>', '', expected=5, flags=re.S, label='service card bot buttons')

          # 4) Remove bot-specific service-card CSS and finish the mobile Hero animation override.
          sub(r'\n    \.card-calc-btn \{.*?\n    \}', '', expected=1, flags=re.S, label='card calc css')
          sub(r'\n    \.svc-prem-card:hover \.card-calc-btn \{.*?\}', '', expected=1, flags=re.S, label='card calc hover css')
          sub(r'\n    \.card-calc-btn:hover \{.*?\}', '', expected=1, flags=re.S, label='card calc hover 2 css')
          old_mobile_cards = '@media (max-width: 768px) { .card-calc-btn { opacity: 1; transform: translateY(0); } .card-pbtn { opacity: 1; transform: translateY(0); } .gold-particles { display: none; } }'
          if old_mobile_cards not in s:
              raise SystemExit('mobile card calc rule not found')
          s = s.replace(old_mobile_cards, '@media (max-width: 768px) { .card-pbtn { opacity: 1; transform: translateY(0); } .gold-particles { display: none; } }', 1)

          old_hero_mobile = '.hero-badge, .hero > h1, .hero-tagline, .hero-sub, .hero-location, .hero-btns, .hero-stats { animation: none !important; }'
          if old_hero_mobile not in s:
              raise SystemExit('mobile Hero rule not found')
          s = s.replace(old_hero_mobile, '.hero-lines, .hero-bg, .hero-badge, .hero > h1, .hero-tagline, .hero-sub, .hero-location, .hero-btns, .hero-stats { animation: none !important; }', 1)
          s = s.replace('.calc-svg-pulse svg, .float-btn { animation: none !important; filter: none !important; box-shadow: none !important; }', '.float-btn { animation: none !important; filter: none !important; box-shadow: none !important; }', 1)

          # 5) Remove bot CTAs elsewhere, preserving direct phone/Messenger alternatives.
          sub(r'\n<p style="margin-top:1rem;font-size:\.75rem;color:rgba\(201,148,58,\.35\);">или <button onclick="openTeryBot\(\)".*?</p>', '', expected=1, flags=re.S, label='urgency bot line')
          sub(r'<p style="margin-top:\.6rem;font-size:\.82rem;"><button onclick="openTeryBot\(\)".*?</button></p>', '', expected=1, flags=re.S, label='faq calculator line')
          sub(r'<button onclick="openTeryBot\([^\)]*\)".*?</button>', '', expected=2, flags=re.S, label='process/faq bot buttons')

          # 6) Service modal: remove bot CTA UI, keep decorative-plaster hint working.
          sub(r'\n<div id="svcModalBotBtn".*?</div>\n(?=<div id="svcModalMazHint")', '\n', expected=1, flags=re.S, label='modal bot block')
          sub(r", botState: '(?:putty_menu|painting_menu|gk_menu|vik_menu|windows_menu)'", '', expected=5, label='serviceData botState strings')
          sub(r', botState: null', '', expected=1, label='serviceData null botState')

          old_modal_logic = '''    // Fix #2: показваме правилния CTA в modal-а (bot button за услуги с калкулатор, hint за мазилка)
    var botBtn = document.getElementById('svcModalBotBtn');
    var mazHint = document.getElementById('svcModalMazHint');
    var optName = document.getElementById('svcModalBotOptName');
    if (botBtn && mazHint) {
      if (s.botState) {
        botBtn.style.display = 'block';
        mazHint.style.display = 'none';
        if (optName) optName.textContent = '';
      } else {
        botBtn.style.display = 'none';
        mazHint.style.display = 'block';
      }
    }'''
          new_modal_logic = '''    // Декоративната мазилка остава с индивидуална цена по оглед.
    var mazHint = document.getElementById('svcModalMazHint');
    if (mazHint) mazHint.style.display = id === 'maz' ? 'block' : 'none';'''
          if old_modal_logic not in s:
              raise SystemExit('service modal bot logic not found')
          s = s.replace(old_modal_logic, new_modal_logic, 1)

          sub(r"\n    // Fix #2: показваме избраната опция в bot-button-а\n    var optName = document\.getElementById\('svcModalBotOptName'\);\n    if \(optName\) optName\.textContent = '→ ' \+ name;", '', expected=1, label='selected option bot text')
          sub(r'\n  // Fix #2: Отваря бота от service modal с правилния state\n  function openBotFromModal\(\) \{.*?\n  \}', '', expected=1, flags=re.S, label='openBotFromModal function')
          s = s.replace("\n  window._botFromModal = openBotFromModal;", '')

          # 7) Remove TeryBot runtime, dynamic Hero pulse CSS and tooltip logic.
          sub(
              r'\n  // TERYBOT INTEGRATION — зарежда се само при първо отваряне.*?(?=\n  let scrollProgressTicking = false;)',
              '\n', expected=1, flags=re.S, label='TeryBot runtime + tooltip'
          )

          # 8) Remove the visible bot tooltip node.
          sub(r'\n<div id="bot-tooltip".*?</div>', '', expected=1, flags=re.S, label='bot tooltip html')

          # 9) Remove lazy TeryBot loader entirely.
          sub(
              r'\n<!-- TERYBOT LOADER — зарежда bot\.html само при първо отваряне -->\n<script>.*?</script>\n',
              '\n', expected=1, flags=re.S, label='TeryBot loader'
          )

          # 10) Remove dynamic CSS injection + typewriter JS; quote observer remains.
          sub(
              r'\n  // ANIMATIONS CSS\n  \(function\(\)\{.*?\n  \}\)\(\);\n\n  // TYPEWRITER — "Питаш\. Получаваш\. Веднага\."\n  \(function\(\)\{.*?\n  \}\)\(\);\n',
              '\n', expected=1, flags=re.S, label='dynamic animation css + typewriter js'
          )

          # 11) Mobile counters are static; desktop keeps the existing animation.
          counters_pattern = r'''  // ANIMATED COUNTERS\n  function animateCounter\(el\) \{.*?  if \(statsEl\) counterObserver\.observe\(statsEl\);\n'''
          counters_repl = '''  // HERO STATS — статични на мобилен, анимирани само на по-голям екран.
  function setCounterFinal(el) {
    const target = parseInt(el.dataset.target);
    if (target === 250) el.textContent = '250+';
    else if (target === 23) el.textContent = '23г.';
    else if (target) el.textContent = target;
  }
  function animateCounter(el) {
    const target = parseInt(el.dataset.target);
    if (!target) return;
    let current = 0;
    el.textContent = '0';
    const step = Math.ceil(target / 60);
    const timer = setInterval(() => {
      current += step;
      if (current >= target) { current = target; clearInterval(timer); }
      if (target === 250) el.textContent = current + '+';
      else if (target === 23) el.textContent = current + 'г.';
      else el.textContent = current;
    }, 25);
  }
  const statsEl = document.querySelector('.hero-stats');
  if (statsEl) {
    const counterEls = statsEl.querySelectorAll('[data-target]');
    if (window.matchMedia('(max-width: 768px)').matches) {
      counterEls.forEach(setCounterFinal);
    } else {
      const counterObserver = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            counterEls.forEach(animateCounter);
            counterObserver.disconnect();
          }
        });
      }, { threshold: 0.1 });
      counterObserver.observe(statsEl);
    }
  }
'''
          sub(counters_pattern, counters_repl, expected=1, flags=re.S, label='mobile static counters')

          # 12) Update obsolete floating-button comment.
          s = s.replace('/* Mobile: скриваме Messenger — остават само Phone и Бот */', '/* Mobile: скриваме Messenger — остава директният телефон */')

          # Safety assertions.
          forbidden = [
              'openTeryBot(', 'ensureBotLoaded', 'bot.html?v=', 'hero-calc-badge',
              'hero-tw', 'heroBadgePulse', 'card-calc-btn', 'svcModalBotBtn',
              'svcModalBotOptName', 'openBotFromModal', 'bot-tooltip'
          ]
          for token in forbidden:
              if token in s:
                  raise SystemExit(f'forbidden token remains: {token}')

          required = [
              'data-target="250">250+</span>', 'data-target="23">23г.</span>',
              '.hero-lines, .hero-bg, .hero-badge',
              'AW-18264667036/SmmrCLHN9dQcEJznooVE',
              'AW-18264667036/Rnw8CLvTgcQcEJznooVE',
              'G-SVED9CDFPR',
              'https://formspree.io/f/mpqovoya',
              'analytics/tracker.js'
          ]
          for token in required:
              if token not in s:
                  raise SystemExit(f'required token missing: {token}')

          if s == original:
              raise SystemExit('no changes produced')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate HTML JavaScript and diff
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, os
          s = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S|re.I)
          checked = 0
          for i, code in enumerate(scripts):
              if not code.strip():
                  continue
              with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False, encoding='utf-8') as f:
                  f.write(code)
                  name = f.name
              r = subprocess.run(['node','--check',name], capture_output=True, text=True)
              os.unlink(name)
              if r.returncode:
                  raise SystemExit(f'inline JS block {i} failed:\n{r.stderr}')
              checked += 1
          print('INLINE_JS_OK', checked)
          print('SIZE_BYTES', len(s.encode('utf-8')))
          PY
          git diff --stat
          git diff -- index.html | sed -n '1,320p'

      - name: Commit approved Hero cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "perf: simplify mobile Hero and remove TeryBot"
          git push origin main

# armed 2026-08-09
