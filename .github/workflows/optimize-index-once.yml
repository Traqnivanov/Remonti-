name: Optimize index once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    if: contains(github.event.head_commit.message, 'RUN_INDEX_OPT_A_B')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply only approved A+B changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          original = text

          # A: Lazy-load exactly the 6 service-card images (.card-img).
          pat = re.compile(r'<img\b(?=[^>]*\bclass="card-img")[^>]*>')
          tags = pat.findall(text)
          assert len(tags) == 6, f'Expected 6 card-img tags, found {len(tags)}'
          assert all('loading=' not in t for t in tags), 'A card-img already has loading attribute; aborting'

          def add_lazy(m):
              tag = m.group(0)
              if 'decoding="async"' in tag:
                  return tag.replace('decoding="async"', 'decoding="async" loading="lazy"', 1)
              return tag[:-1] + ' loading="lazy">'

          text, n = pat.subn(add_lazy, text)
          assert n == 6

          # B: Remove the one incorrect layout override from the floating tooltip setup.
          bad = "      floatingBtns.style.position = 'relative';\n"
          assert text.count(bad) == 1, f'Expected exactly one floatingBtns position override, found {text.count(bad)}'
          text = text.replace(bad, '', 1)

          assert text != original
          assert text.count('class="card-img"') == original.count('class="card-img"') == 6
          assert len(re.findall(r'<img\b(?=[^>]*\bclass="card-img")(?=[^>]*\bloading="lazy")[^>]*>', text)) == 6
          assert "floatingBtns.style.position = 'relative'" not in text

          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate diff and inline JavaScript
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile

          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script([^>]*)>(.*?)</script>', html, flags=re.I|re.S)
          checked = 0
          for attrs, code in scripts:
              if 'application/ld+json' in attrs.lower():
                  continue
              if not code.strip():
                  continue
              with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as f:
                  f.write(code)
                  name = f.name
              subprocess.run(['node', '--check', name], check=True)
              checked += 1
          print(f'Inline JS syntax OK: {checked} blocks')
          PY
          test "$(git diff -- index.html | grep -c '^+.*loading=\"lazy\"')" -eq 6
          test "$(git diff -- index.html | grep -c "^-.*floatingBtns.style.position = 'relative'")" -eq 1
          git diff -- index.html

      - name: Commit approved changes
        shell: bash
        run: |
          git config user.name "Ivanov Remonti Optimizer"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Optimize service image loading and floating controls"
          git push origin main
