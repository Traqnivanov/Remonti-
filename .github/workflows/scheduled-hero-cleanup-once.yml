name: Scheduled one-time Hero cleanup

on:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  run-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Execute validated cleanup workflow steps
        shell: bash
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import subprocess, yaml
          from pathlib import Path
          wf = yaml.safe_load(Path('.github/workflows/hero-bot-cleanup-once.yml').read_text(encoding='utf-8'))
          steps = wf['jobs']['cleanup']['steps']
          ran = 0
          for step in steps:
              script = step.get('run')
              if not script:
                  continue
              print('===', step.get('name', f'run-{ran+1}'), '===', flush=True)
              subprocess.run(script, shell=True, executable='/bin/bash', check=True)
              ran += 1
          if ran < 3:
              raise SystemExit(f'Expected at least 3 run steps, executed {ran}')
          PY
